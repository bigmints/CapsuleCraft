name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the GitHub release as a draft"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The recommended Linux artifact: the native egui shell as a standalone,
  # zero-dependency AppImage. Built on ubuntu-22.04 so the bundled binary
  # references glibc 2.35 (not a rolling-distro glibc), which keeps the
  # package self-contained per the appimage.github.io catalog checks.
  native-appimage:
    name: Native AppImage (zero-dep, ubuntu-22.04)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-dev libx11-xcb-dev \
            libwayland-dev \
            libfontconfig1-dev libfreetype6-dev \
            libssl-dev \
            libxkbcommon-x11-0 libxkbcommon0 \
            libx11-6 libx11-xcb1 libxcb1 \
            libxcursor1 libxrandr2 libxi6 \
            libxfixes3 libxrender1 libxext6 \
            libxau6 libxdmcp6 \
            libwayland-client0

      - name: Build native shell
        run: cargo build --release --manifest-path native/Cargo.toml

      - name: Assemble AppDir
        run: |
          set -e
          APPDIR=native/packaging/AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR"/usr/bin \
                   "$APPDIR"/usr/lib \
                   "$APPDIR"/usr/share/applications \
                   "$APPDIR"/usr/share/icons/hicolor/256x256/apps
          install -m 0755 native/target/release/capsuleos-native "$APPDIR"/usr/bin/capsuleos-native
          cp src-tauri/icons/128x128@2x.png \
             "$APPDIR"/usr/share/icons/hicolor/256x256/apps/capsulecraft.png
          ln -s usr/bin/capsuleos-native "$APPDIR"/AppRun
          ln -s capsulecraft.png "$APPDIR"/.DirIcon
          # winit/x11-dl/xkbcommon-dl load these with dlopen() at runtime, which
          # linuxdeploy cannot see (no DT_NEEDED). Bundle them (plus transitive
          # deps)explicitly so the app works in minimal/firejail environments.
          LIB=/usr/lib/x86_64-linux-gnu
          for f in \
            libxkbcommon.so.0 libxkbcommon-x11.so.0 \
            libX11.so.6 libX11-xcb.so.1 libxcb.so.1 \
            libXcursor.so.2 libXrandr.so.2 libXi.so.6 \
            libXfixes.so.3 libXrender.so.1 libXext.so.6 \
            libXau.so.6 libXdmcp.so.6 \
            libwayland-client.so.0 libffi.so.8 \
            ; do
            cp -L "$LIB/$f" "$APPDIR"/usr/lib/ || echo "WARN: missing $LIB/$f"
          done
          # cp -a copied symlinks without their targets on ubuntu-22.04; make
          # sure nothing inside the AppImage points at a missing file.
          if find "$APPDIR"/usr/lib -xtype l | grep -q .; then
            echo "ERROR: broken symlinks in AppDir/usr/lib:"
            find "$APPDIR"/usr/lib -xtype l -printf '%p -> %l\n'
            exit 1
          fi
          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=CapsuleCraft' \
            'GenericName=Knowledge base as mail' \
            'Comment=Your knowledge base is a folder of emails (.eml). Offline, zero DB.' \
            'Exec=capsuleos-native' \
            'Icon=capsulecraft' \
            'Categories=Office;TextEditor;Development;' \
            'Keywords=notes;knowledge;eml;email;offline;' \
            'StartupWMClass=capsuleos-native' \
            'Type=Application' \
            'Terminal=false' \
            > native/packaging/AppDir/usr/share/applications/capsulecraft.desktop
          mkdir -p native/packaging/AppDir/usr/share/metainfo
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<component type="desktop-application">' \
            '  <id>com.capsuleos.CapsuleCraft</id>' \
            '  <name>CapsuleCraft</name>' \
            '  <summary>Offline knowledge base stored as a folder of .eml files</summary>' \
            '  <metadata_license>MIT</metadata_license>' \
            '  <project_license>MIT</project_license>' \
            '  <description>' \
            '    <p>CapsuleCraft stores every note as a standards-compliant email (.eml) file in a folder you own. No database, no account, no network required.</p>' \
            '    <p>Native egui shell, built-in FAQ, Markdown blocks, attachments, search, and an optional IMAP mailbox sync.</p>' \
            '  </description>' \
            '  <launchable type="desktop-id">capsulecraft.desktop</launchable>' \
            '  <url type="homepage">https://github.com/kostyk348/CapsuleCraft</url>' \
            '  <categories>' \
            '    <category>Office</category>' \
            '    <category>Utility</category>' \
            '  </categories>' \
            '  <releases>' \
            '    <release version="1.7.0" date="2026-10-25"/>' \
            '  </releases>' \
            '</component>' \
            > native/packaging/AppDir/usr/share/metainfo/com.capsuleos.CapsuleCraft.appdata.xml

      - name: Package AppImage (linuxdeploy, bundles shared libs)
        run: |
          set -e
          curl -sSL -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          export VERSION="${GITHUB_REF#refs/tags/v}"
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy.AppImage \
            --appdir native/packaging/AppDir \
            -d native/packaging/AppDir/usr/share/applications/capsulecraft.desktop \
            -i native/packaging/AppDir/usr/share/icons/hicolor/256x256/apps/capsulecraft.png \
            --output appimage
          FILE="CapsuleCraft_${VERSION}_amd64.AppImage"
          OUT=$(find . -maxdepth 1 -name '*.AppImage' ! -name 'linuxdeploy*' -print -quit)
          [ -n "$OUT" ] || { ls; echo "linuxdeploy produced no AppImage"; exit 1; }
          mv -f "$OUT" "$FILE"
          test -f "$FILE"

      - name: Upload AppImage and SHA256SUMS to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${GITHUB_REF#refs/tags/v}"
          FILE="CapsuleCraft_${VERSION}_amd64.AppImage"
          gh release upload "$TAG" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"
          sha256sum "$FILE" | awk '{print $1"  "$2}' > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

  # Native macOS bundle: the same egui shell assembled into a .app with an
  # ad-hoc signature, so an unzipped local launch is not blocked outright.
  native-macos:
    name: Native macOS app (arm64)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build native shell
        run: cargo build --release --manifest-path native/Cargo.toml

      - name: Assemble .app bundle
        run: |
          set -e
          VERSION="${GITHUB_REF#refs/tags/v}"
          APP=CapsuleCraft.app
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          install -m 0755 native/target/release/capsuleos-native "$APP/Contents/MacOS/capsuleos-native"
          cp src-tauri/icons/icon.icns "$APP/Contents/Resources/capsulecraft.icns"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '  <key>CFBundleName</key><string>CapsuleCraft</string>' \
            '  <key>CFBundleDisplayName</key><string>CapsuleCraft</string>' \
            '  <key>CFBundleIdentifier</key><string>com.capsuleos.capsulecraft</string>' \
            '  <key>CFBundleExecutable</key><string>capsuleos-native</string>' \
            '  <key>CFBundleIconFile</key><string>capsulecraft</string>' \
            '  <key>CFBundlePackageType</key><string>APPL</string>' \
            "  <key>CFBundleShortVersionString</key><string>${VERSION}</string>" \
            "  <key>CFBundleVersion</key><string>${VERSION}</string>" \
            '  <key>LSMinimumSystemVersion</key><string>11.0</string>' \
            '  <key>NSHighResolutionCapable</key><true/>' \
            '</dict>' \
            '</plist>' \
            > "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "CapsuleCraft_native_${VERSION}_arm64.app.zip"
          shasum -a 256 "CapsuleCraft_native_${VERSION}_arm64.app.zip" \
            | awk '{print $1"  "$2}' > SHA256SUMS-macos.txt

      - name: Upload macOS app to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${GITHUB_REF#refs/tags/v}"
          gh release upload "$TAG" \
            "CapsuleCraft_native_${VERSION}_arm64.app.zip" \
            SHA256SUMS-macos.txt \
            --clobber --repo "$GITHUB_REPOSITORY"

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: Windows x64 (msi + nsis)
            cache-key: windows-x64
            bundles: msi,nsis
          - platform: ubuntu-22.04
            name: Linux x64 (deb + rpm)
            cache-key: linux-x64
            bundles: deb,rpm
          - platform: macos-latest
            name: macOS arm64 (app + dmg)
            cache-key: macos-arm64
            bundles: app,dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.cache-key }}

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('CapsuleCraft {0}', github.ref_name) || '' }}
          args: --bundles ${{ matrix.bundles }}
          releaseBody: |
            ## CapsuleCraft ${{ github.ref_name }}

            Zero-DB, pure-MIME workspace. Native egui desktop builds plus legacy web/Tauri installers.

            ### Linux x64
            - `CapsuleCraft_*_amd64.AppImage` — native shell, no webview; `chmod +x` and run
            - `CapsuleCraft_*_amd64.deb`, `CapsuleCraft-*_x86_64.rpm` — legacy Tauri packages (need `libwebkit2gtk-4.1-0`)

            Built on Ubuntu 22.04 (glibc 2.35+). The AppImage bundles the fonts/rendering and X11/xkbcommon libraries it needs.

            ### macOS (arm64)
            - `CapsuleCraft_native_*_arm64.app.zip` — native shell, ad-hoc signed; unzip and drag `CapsuleCraft.app` to Applications
            - `CapsuleCraft_*_aarch64.dmg` — legacy Tauri package

            ### Windows x64
            - `CapsuleCraft_*_x64_en-US.msi` — Windows Installer package
            - `CapsuleCraft_*_x64-setup.exe` — NSIS installer

            Requires Microsoft Edge WebView2 Runtime (preinstalled on Windows 10/11).

            ### Data location
            - Windows: `%APPDATA%\com.capsuleos.app\vault\`
            - macOS: `~/Library/Application Support/com.capsuleos.app/vault/`
            - Linux: `~/.local/share/com.capsuleos.app/vault/`

            One `.eml` file per capsule.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: capsuleos-${{ matrix.cache-key }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb

      - name: Checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content -Path src-tauri/target/release/bundle/SHA256SUMS.txt
          Get-Content src-tauri/target/release/bundle/SHA256SUMS.txt

      - name: Checksums (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd src-tauri/target/release/bundle
          find . -type f \( -name "*.deb" -o -name "*.rpm" \) -printf "%P\n" |
            xargs -r -I{} sha256sum "{}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: capsuleos-${{ matrix.cache-key }}-checksums
          path: src-tauri/target/release/bundle/SHA256SUMS.txt
