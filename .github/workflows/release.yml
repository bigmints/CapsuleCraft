name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the GitHub release as a draft"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: Windows x64 (msi + nsis)
            cache-key: windows-x64
          - platform: ubuntu-22.04
            name: Linux x64 (appimage + deb)
            cache-key: linux-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.cache-key }}

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('CapsuleCraft {0}', github.ref_name) || '' }}
          releaseBody: |
            ## CapsuleCraft ${{ github.ref_name }}

            Zero-DB, pure-MIME multimodal workspace. Native desktop builds (Tauri 2 + React 19).

            ### Windows x64
            - `CapsuleCraft_*_x64_en-US.msi` — Windows Installer package
            - `CapsuleCraft_*_x64-setup.exe` — NSIS installer

            Requires Microsoft Edge WebView2 Runtime (preinstalled on Windows 10/11).

            ### Linux x64
            - `CapsuleCraft_*_amd64.AppImage` — portable, `chmod +x` and run
            - `CapsuleCraft_*_amd64.deb` — Debian / Ubuntu package

            Built on Ubuntu 22.04 (glibc 2.35+). WebKitGTK 4.1 is a runtime dependency on Linux (`sudo apt install libwebkit2gtk-4.1-0`), AppImage bundles most libraries.

            ### Data location
            - Windows: `%APPDATA%\com.capsuleos.app\vault\`
            - Linux: `~/.local/share/com.capsuleos.app/vault/`

            One `.eml` file per capsule.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false

      # The Tauri bundler can pack AppRun/AppRun.wrapped with mode 0770, which
      # breaks the AppImage for every non-root user (appimage.github.io fails
      # with "Permission denied"). Extract, fix the permissions and repack,
      # then re-upload the fixed artifact over the one tauri-action published.
      - name: Repack AppImage with sane file modes
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)
          [ -n "$APPIMAGE" ] || { echo "no AppImage produced"; exit 1; }
          APPIMAGE_NAME=$(basename "$APPIMAGE")
          rm -rf repack
          mkdir repack
          cp "$APPIMAGE" "repack/$APPIMAGE_NAME"
          cd repack
          rm -rf squashfs-root
          ./"$APPIMAGE_NAME" --appimage-extract >/dev/null
          chmod -R a+rX,ug+w squashfs-root
          curl -sSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage -n squashfs-root "$APPIMAGE_NAME"
          rm -rf squashfs-root
          cd ..
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -n "$TAG" ] && [ "$TAG" != "main" ]; then
            gh release upload "$TAG" "repack/$APPIMAGE_NAME" --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "No tag: skipping re-upload (workflow_dispatch)"
          fi

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: capsuleos-${{ matrix.cache-key }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

      - name: Checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content -Path src-tauri/target/release/bundle/SHA256SUMS.txt
          Get-Content src-tauri/target/release/bundle/SHA256SUMS.txt

      - name: Checksums (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd src-tauri/target/release/bundle
          find . -type f \( -name "*.AppImage" -o -name "*.deb" \) -printf "%P\n" |
            xargs -I{} sha256sum "{}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: capsuleos-${{ matrix.cache-key }}-checksums
          path: src-tauri/target/release/bundle/SHA256SUMS.txt
