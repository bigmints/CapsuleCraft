name: Feature request
description: Propose a capability for CapsuleCraft
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        CapsuleCraft has two hard constraints: **everything is a `.eml` file** and **there is no server or database**.
        Please frame the idea inside those limits.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: format
    attributes:
      label: Impact on the capsule format
      description: New MIME part, new header, new block type — or none?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
